name: Backtest

on:
  workflow_dispatch:

# "write" lets the job save results back into the repo, so the web page updates.
permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtests
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python run_backtests.py

      - name: Save results and cached bars to the repo
        run: |
          git config user.name "backtest-bot"
          git config user.email "backtest-bot@users.noreply.github.com"
          git add results data
          if git diff --cached --quiet; then
            echo "No changes to save"
          else
            git commit -m "Backtest results $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Keep a copy as a download
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            results/
            data/
          if-no-files-found: error
